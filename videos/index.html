<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos — Avital Tzubeli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1c0a06;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      min-height: 100vh;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(28, 10, 6, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    nav a.wordmark {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    nav a.back {
      font-weight: 600;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    nav a.back:hover { color: #fff; }

    /* Hero */
    .hero {
      padding: 160px 24px 80px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.26em;
      font-weight: 700;
      font-size: 13px;
      background: linear-gradient(120deg, #ff075f, #ff8021);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.015em;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: clamp(16px, 1.8vw, 19px);
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
    }

    /* Videos grid */
    .videos-section {
      padding: 0 24px 120px;
      max-width: 860px;
      margin: 0 auto;
    }
    .videos-grid {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }
    .video-card {
      border-radius: 20px;
      overflow: hidden;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Footer */
    footer {
      background: linear-gradient(120deg, #ff075f 0%, #ff8021 100%);
      padding: 40px 24px;
    }
    .footer-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
    }
    footer p {
      font-weight: 500;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }
    footer a.ft-email {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      padding-bottom: 2px;
      transition: border-color 0.25s;
    }
    footer a.ft-email:hover { border-color: #fff; }
    .ft-social-row { display: flex; align-items: center; gap: 12px; }
    footer a.ft-social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
      color: #fff;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }
    footer a.ft-social:hover {
      background: rgba(255,255,255,0.18);
      border-color: #fff;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .videos-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a class="wordmark" href="../index.html">Avital Tzubeli</a>
    <a class="back" href="../index.html">← Back</a>

    <p class="eyebrow">Watch</p>

        </div>

      <div class="video-card">

        </div>
      </div>

      <div class="video-card">
        <div class="video-wrapper">
          <iframe src="https://player.vimeo.com/video/1219619880?badge=0&autopause=0&title=0&byline=0&portrait=0&dnt=1&player_id=0&app_id=58479" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" title="Video 3"></iframe>
        </div>

    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <p>© Avital Tzubeli</p>
      <a href="mailto:hello@avitaltzubeli.com" class="ft-email">hello@avitaltzubeli.com</a>
      <div class="ft-social-row">
        <a href="https://www.instagram.com/avitaltzubeli/" target="_blank" rel="noopener" aria-label="Instagram" class="ft-social">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"></circle></svg>

  <script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
